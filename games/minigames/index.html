      // Encerra assim que o React avisa (evento 'ldi:ready'). O som é opcional: se o navegador bloquear, segue sem.

        try { seen = localStorage.getItem(KEY); lang = localStorage.getItem('ldi-locale') || 'pt'; } catch (e) {}
        if (seen === today) { el.remove(); return; }
        try { localStorage.setItem(KEY, today); } catch (e) {}

        }
        function tryFinish() {
          if (!ready) return;
          var left = MIN - (Date.now() - start);

      })();

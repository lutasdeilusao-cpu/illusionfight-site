<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MG-05 · Bullet Hell</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap');

:root {
  --bg:     #05050f;
  --cyan:   #00e5ff;
  --purple: #b400ff;
  --red:    #ff0055;
  --gold:   #ffcc00;
  --ghost:  #2a3a5a;
  --mono:   'Share Tech Mono', monospace;
  --head:   'Bebas Neue', sans-serif;
}

* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

html, body {
  width:100%; height:100%; overflow:hidden;
  background:var(--bg);
  font-family:var(--mono);
  user-select:none; -webkit-user-select:none;
}

body::after {
  content:''; position:fixed; inset:0; z-index:9999; pointer-events:none;
  background:repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0,0,0,0.18) 2px, rgba(0,0,0,0.18) 4px
  );
}

.grid-bg {
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
  background-size:28px 28px;
}

.screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 24px; }
.screen.off { display:none; }

/* ── SELECT ── */
.sel-tag   { font-size:.62rem; letter-spacing:.35em; color:var(--ghost); text-transform:uppercase; margin-bottom:10px; }
.sel-title { font-family:var(--head); font-size:3.4rem; letter-spacing:.12em; color:var(--cyan); text-align:center; line-height:1; text-shadow:0 0 24px var(--cyan),0 0 48px rgba(0,229,255,.25); margin-bottom:6px; }
.sel-sub   { font-size:.62rem; letter-spacing:.18em; color:var(--ghost); text-transform:uppercase; text-align:center; margin-bottom:40px; }

.btns { display:flex; flex-direction:column; gap:8px; width:100%; max-width:340px; }
.diff-btn { background:transparent; border:1px solid var(--ghost); font-family:var(--mono); text-transform:uppercase; display:flex; flex-direction:column; justify-content:center; gap:3px; padding:0 18px; min-height:58px; cursor:pointer; transition:.15s; text-align:left; }
.diff-btn .dn { font-size:.85rem; letter-spacing:.12em; }
.diff-btn .di { font-size:.58rem; letter-spacing:.08em; color:var(--ghost); }
.dif-easy   .dn { color:var(--cyan); }
.dif-normal .dn { color:var(--purple); }
.dif-hard   .dn { color:var(--red); }
.diff-btn:active { opacity:.7; }
@media(hover:hover){
  .dif-easy:hover   { border-color:var(--cyan);   background:rgba(0,229,255,.04); }
  .dif-normal:hover { border-color:var(--purple); background:rgba(180,0,255,.04); }
  .dif-hard:hover   { border-color:var(--red);    background:rgba(255,0,85,.04); }
}

/* ── COUNTDOWN ── */
#cdown { background:var(--bg); }
.cdown-n {
  font-family:var(--head); font-size:9rem; line-height:1; color:var(--cyan);
  text-shadow:0 0 30px var(--cyan);
  animation:popIn .6s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes popIn { from{transform:scale(2);opacity:0} to{transform:scale(1);opacity:1} }

/* ── GAME ── */
#game { padding:0; justify-content:flex-start; }

.hud {
  width:100%; display:flex; align-items:center; justify-content:space-between;
  padding:8px 16px; border-bottom:1px solid var(--ghost);
  background:rgba(5,5,15,.95); flex-shrink:0; z-index:10;
}
.hud-timer {
  font-family:var(--head); font-size:2.2rem; letter-spacing:.06em;
  color:var(--cyan); min-width:72px; transition:color .3s, text-shadow .3s;
}
.hud-timer.t-warn   { color:var(--gold); text-shadow:0 0 12px var(--gold); }
.hud-timer.t-danger { color:var(--red);  text-shadow:0 0 12px var(--red); animation:blink .45s infinite; }
@keyframes blink { 50%{opacity:.4} }

.hud-center { text-align:center; }
.hud-label  { font-size:.55rem; letter-spacing:.2em; color:var(--ghost); text-transform:uppercase; }
.hud-mode   { font-family:var(--head); font-size:1.3rem; letter-spacing:.08em; display:block; }
.hud-diff   { font-size:.6rem; letter-spacing:.12em; text-transform:uppercase; text-align:right; min-width:72px; }

canvas#arena { display:block; flex:1; width:100%; touch-action:none; }

/* ── RESULT ── */
#result { gap:14px; }
.res-tag   { font-size:.62rem; letter-spacing:.35em; color:var(--ghost); text-transform:uppercase; }
.res-title { font-family:var(--head); font-size:3.2rem; letter-spacing:.12em; line-height:1; text-align:center; }
.res-title.ok  { color:var(--cyan);  text-shadow:0 0 20px var(--cyan); }
.res-title.bad { color:var(--red);   text-shadow:0 0 20px var(--red); }
.res-msg   { font-size:.68rem; letter-spacing:.08em; color:var(--ghost); text-align:center; line-height:1.9; max-width:300px; }
.res-stats { border:1px solid var(--ghost); padding:12px 20px; font-size:.65rem; letter-spacing:.1em; color:var(--ghost); line-height:2.1; text-align:center; min-width:260px; background:rgba(0,229,255,.03); }
.res-stats b { color:var(--cyan); font-weight:normal; }
.res-btns  { display:flex; flex-direction:column; gap:8px; width:100%; max-width:300px; margin-top:6px; }
.res-btn   { background:transparent; font-family:var(--mono); font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; border:1px solid; min-height:48px; cursor:pointer; transition:.15s; }
.res-btn.p { border-color:var(--cyan);  color:var(--cyan); }
.res-btn.s { border-color:var(--ghost); color:var(--ghost); }
.res-btn.p:active { background:var(--cyan);  color:var(--bg); }
.res-btn.s:active { border-color:var(--cyan); color:var(--cyan); }
@media(hover:hover){
  .res-btn.p:hover { background:var(--cyan);  color:var(--bg); }
  .res-btn.s:hover { border-color:var(--cyan); color:var(--cyan); }
}
</style>
</head>
<body>

<!-- SELECT -->
<div id="sel" class="screen grid-bg">
  <div class="sel-tag">Minigame · MG-05</div>
  <div class="sel-title">BULLET<br>HELL</div>
  <div class="sel-sub">Toque na tela · Mova · Sobreviva</div>
  <div class="btns">
    <button class="diff-btn dif-easy"   onclick="pick('easy')">
      <span class="dn">◎ Fácil</span>
      <span class="di">5 projéteis · trajetória reta · 15 segundos</span>
    </button>
    <button class="diff-btn dif-normal" onclick="pick('normal')">
      <span class="dn">◎ Normal</span>
      <span class="di">7 projéteis · trajetória reta · 20 segundos</span>
    </button>
    <button class="diff-btn dif-hard"   onclick="pick('hard')">
      <span class="dn">◎ Difícil</span>
      <span class="di">5 projéteis · 1 rastreador · 20 segundos</span>
    </button>
  </div>
</div>

<!-- COUNTDOWN -->
<div id="cdown" class="screen off">
  <div class="cdown-n" id="cdown-n">3</div>
</div>

<!-- GAME -->
<div id="game" class="screen off">
  <div class="hud">
    <div class="hud-timer" id="htimer">—</div>
    <div class="hud-center">
      <span class="hud-mode" id="hmode">FÁCIL</span>
      <span class="hud-label">sobreviva</span>
    </div>
    <div class="hud-diff" id="hdiff"></div>
  </div>
  <canvas id="arena"></canvas>
</div>

<!-- RESULT -->
<div id="result" class="screen off grid-bg">
  <div class="res-tag"   id="rtag"></div>
  <div class="res-title" id="rtitle"></div>
  <div class="res-msg"   id="rmsg"></div>
  <div class="res-stats" id="rstats"></div>
  <div class="res-btns">
    <button class="res-btn p" onclick="retry()">◎ Tentar Novamente</button>
    <button class="res-btn s" onclick="goSel()">← Selecionar Dificuldade</button>
  </div>
</div>

<script>
const CFG = {
  easy:   { n:5, time:15, speed:160, r:22, tracking:false, steerDeg:0,  label:'FÁCIL',   col:'#00e5ff', modeLabel:'FÁCIL'   },
  normal: { n:7, time:20, speed:200, r:18, tracking:false, steerDeg:0,  label:'NORMAL',  col:'#b400ff', modeLabel:'NORMAL'  },
  hard:   { n:5, time:20, speed:240, r:14, tracking:true,  steerDeg:10, label:'DIFÍCIL', col:'#ff0055', modeLabel:'DIFÍCIL' },
};

const MSGS_OK = [
  'Todos os projéteis desviados.\nProtocolo de evasão concluído.',
  'Você sobreviveu ao ciclo de fogo.\nSistema intacto.',
  'Reflexos em nível máximo.\nNenhum impacto registrado.',
  'Evasão perfeita, operador.\nMissão cumprida.',
];
const MSGS_FAIL = [
  'Impacto detectado.\nIntegridade comprometida.',
  'Colisão registrada.\nProtocolo de evasão falhou.',
  'Você foi atingido.\nSistema danificado.',
  'Os projéteis te alcançaram.\nTente novamente.',
];

// ── ESTADO ──────────────────────────────────────────────────────────────────
let diff, cfg;
let raf = null, ticker = null;
let t0, timeLeft;
let active = false;
let survived = 0;

// Jogador — placed = já tocou pelo menos uma vez
const player = { x:0, y:0, r:14, alive:true, placed:false };

let bullets = [];
let canvas, ctx, W, H;

// waitingForFirstTouch: jogo renderiza mas timer só começa no 1º toque
let waitingForFirstTouch = true;

// ── TELAS ───────────────────────────────────────────────────────────────────
function show(id) {
  ['sel','cdown','game','result'].forEach(s =>
    document.getElementById(s).classList.toggle('off', s !== id)
  );
}

// ── FLUXO ───────────────────────────────────────────────────────────────────
function pick(d) {
  diff = d; cfg = CFG[d];
  countdown();
}

function countdown() {
  show('cdown');
  const el = document.getElementById('cdown-n');
  let n = 3;
  const step = () => {
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
    el.textContent      = n === 0 ? 'GO!' : n;
    el.style.color      = n === 0 ? cfg.col : '#00e5ff';
    el.style.textShadow = `0 0 30px ${n === 0 ? cfg.col : '#00e5ff'}`;
    if (n === 0) { setTimeout(startGame, 550); return; }
    n--;
    setTimeout(step, 850);
  };
  step();
}

function startGame() {
  show('game');

  canvas = document.getElementById('arena');
  ctx    = canvas.getContext('2d');
  resizeCanvas();

  document.getElementById('hmode').textContent = cfg.modeLabel;
  document.getElementById('hmode').style.color = cfg.col;
  document.getElementById('hdiff').textContent = cfg.label;
  document.getElementById('hdiff').style.color = cfg.col;
  document.getElementById('htimer').textContent = cfg.time;
  document.getElementById('htimer').className   = 'hud-timer';

  // Jogador começa no centro, mas ainda não foi "placed"
  player.x     = W / 2;
  player.y     = H / 2;
  player.alive = true;
  player.placed = false;

  waitingForFirstTouch = true;
  survived = 0;
  timeLeft = cfg.time;
  active   = true;

  spawnBullets();

  // Listeners
  canvas.addEventListener('touchstart', onTouch,    { passive:false });
  canvas.addEventListener('touchmove',  onTouch,    { passive:false });
  // SEM touchend → dedo levantado não apaga o jogador
  canvas.addEventListener('mousedown',  onMouse);
  canvas.addEventListener('mousemove',  onMouse);
  // SEM mouseup → mesmo comportamento no desktop

  raf = requestAnimationFrame(loop);
}

function resizeCanvas() {
  const hud = document.querySelector('.hud');
  W = canvas.width  = canvas.parentElement.clientWidth;
  H = canvas.height = canvas.parentElement.clientHeight - hud.offsetHeight;
}

// ── INPUT ───────────────────────────────────────────────────────────────────
function onTouch(e) {
  e.preventDefault();
  if (!active || !player.alive) return;
  const rect = canvas.getBoundingClientRect();
  const t    = e.touches[0];
  player.x      = t.clientX - rect.left;
  player.y      = t.clientY - rect.top;
  player.placed = true;

  // Primeiro toque: arranca o timer
  if (waitingForFirstTouch) {
    waitingForFirstTouch = false;
    t0     = Date.now();
    ticker = setInterval(tickTimer, 150);
  }
}

function onMouse(e) {
  if (!active || !player.alive) return;
  if (e.buttons === 0 && e.type === 'mousemove') return;
  const rect = canvas.getBoundingClientRect();
  player.x      = e.clientX - rect.left;
  player.y      = e.clientY - rect.top;
  player.placed = true;

  if (waitingForFirstTouch) {
    waitingForFirstTouch = false;
    t0     = Date.now();
    ticker = setInterval(tickTimer, 150);
  }
}

// ── PROJÉTEIS ───────────────────────────────────────────────────────────────
function spawnBullets() {
  bullets = [];
  for (let i = 0; i < cfg.n; i++) {
    const side = Math.floor(Math.random() * 4);
    let bx, by;
    if      (side === 0) { bx = Math.random() * W; by = -cfg.r * 2; }
    else if (side === 1) { bx = W + cfg.r * 2;     by = Math.random() * H; }
    else if (side === 2) { bx = Math.random() * W; by = H + cfg.r * 2; }
    else                 { bx = -cfg.r * 2;         by = Math.random() * H; }

    const cx  = W / 2 + (Math.random() - .5) * W * .3;
    const cy  = H / 2 + (Math.random() - .5) * H * .3;
    const ang = Math.atan2(cy - by, cx - bx);

    bullets.push({
      x: bx, y: by,
      vx: Math.cos(ang) * cfg.speed,
      vy: Math.sin(ang) * cfg.speed,
      phase: Math.random() * Math.PI * 2,
      isTracker: cfg.tracking && i === 0,  // só o primeiro persegue no difícil
    });
  }
}

function updateBullets(dt) {
  const steer = cfg.steerDeg * (Math.PI / 180);
  bullets.forEach(b => {
    // Tracking só faz sentido se o jogador já foi placed
    if (cfg.tracking && b.isTracker && player.placed) {
      const desired = Math.atan2(player.y - b.y, player.x - b.x);
      let current   = Math.atan2(b.vy, b.vx);
      let delta     = desired - current;
      while (delta >  Math.PI) delta -= Math.PI * 2;
      while (delta < -Math.PI) delta += Math.PI * 2;
      delta   = Math.max(-steer, Math.min(steer, delta)) * dt * 60;
      current += delta;
      const sp = Math.hypot(b.vx, b.vy);
      b.vx = Math.cos(current) * sp;
      b.vy = Math.sin(current) * sp;
    }

    b.x += b.vx * dt;
    b.y += b.vy * dt;

    // Rebate nas bordas
    if (b.x - cfg.r < 0)  { b.x = cfg.r;     b.vx =  Math.abs(b.vx); }
    if (b.x + cfg.r > W)  { b.x = W - cfg.r; b.vx = -Math.abs(b.vx); }
    if (b.y - cfg.r < 0)  { b.y = cfg.r;     b.vy =  Math.abs(b.vy); }
    if (b.y + cfg.r > H)  { b.y = H - cfg.r; b.vy = -Math.abs(b.vy); }
  });
}

function checkCollision() {
  // Só verifica colisão depois que o jogador tocou a tela pela primeira vez
  if (!player.placed || !player.alive) return false;
  const hitR = player.r + cfg.r - 4;   // hitbox justa mas não punitiva
  return bullets.some(b =>
    Math.hypot(b.x - player.x, b.y - player.y) < hitR
  );
}

// ── LOOP ────────────────────────────────────────────────────────────────────
let lastTime = 0;
function loop(ts) {
  if (!active) return;
  const dt = Math.min((ts - (lastTime || ts)) / 1000, .05);
  lastTime = ts;

  // Projéteis ficam parados enquanto espera primeiro toque
  if (!waitingForFirstTouch) updateBullets(dt);

  if (checkCollision()) {
    endGame(false);
    draw(ts);
    return;
  }

  draw(ts);
  raf = requestAnimationFrame(loop);
}

function draw(ts) {
  ctx.clearRect(0, 0, W, H);

  // Fundo
  ctx.fillStyle = '#05050f';
  ctx.fillRect(0, 0, W, H);

  // Grid
  ctx.strokeStyle = 'rgba(0,229,255,0.04)';
  ctx.lineWidth   = 1;
  const gs = 28;
  for (let x = 0; x < W; x += gs) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += gs) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // Projéteis
  const now = ts / 1000;
  bullets.forEach(b => {
    // Cor: tracker usa dourado para se destacar dos demais no difícil
    const bCol = b.isTracker ? '#ffcc00' : cfg.col;

    const pulse = .7 + .3 * Math.sin(now * 4 + b.phase);
    const grd   = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, cfg.r * 2.5);
    grd.addColorStop(0, hexAlpha(bCol, .35 * pulse));
    grd.addColorStop(1, 'transparent');
    ctx.beginPath(); ctx.arc(b.x, b.y, cfg.r * 2.5, 0, Math.PI*2);
    ctx.fillStyle = grd; ctx.fill();

    ctx.beginPath(); ctx.arc(b.x, b.y, cfg.r, 0, Math.PI*2);
    ctx.fillStyle   = hexAlpha(bCol, .15);
    ctx.strokeStyle = bCol;
    ctx.lineWidth   = b.isTracker ? 2.5 : 1.5;
    ctx.fill();
    ctx.shadowColor = bCol; ctx.shadowBlur = 8 * pulse;
    ctx.stroke(); ctx.shadowBlur = 0;

    if (b.isTracker) {
      const ang = Math.atan2(b.vy, b.vx);
      ctx.beginPath();
      ctx.moveTo(b.x + Math.cos(ang) * cfg.r, b.y + Math.sin(ang) * cfg.r);
      ctx.lineTo(b.x + Math.cos(ang) * (cfg.r+7), b.y + Math.sin(ang) * (cfg.r+7));
      ctx.strokeStyle = hexAlpha('#ffcc00', .6); ctx.lineWidth = 1.5; ctx.stroke();
    }
  });

  // Jogador — sempre visível após primeiro toque, fica na última posição
  if (player.placed && player.alive) {
    const pr   = player.r;
    const grd2 = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, pr * 3);
    grd2.addColorStop(0, 'rgba(0,229,255,0.2)');
    grd2.addColorStop(1, 'transparent');
    ctx.beginPath(); ctx.arc(player.x, player.y, pr * 3, 0, Math.PI*2);
    ctx.fillStyle = grd2; ctx.fill();

    const s = pr + 6;
    ctx.strokeStyle = 'rgba(0,229,255,0.6)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(player.x - s, player.y); ctx.lineTo(player.x + s, player.y);
    ctx.moveTo(player.x, player.y - s); ctx.lineTo(player.x, player.y + s);
    ctx.stroke();

    ctx.beginPath(); ctx.arc(player.x, player.y, pr, 0, Math.PI*2);
    ctx.fillStyle   = 'rgba(0,229,255,0.15)';
    ctx.strokeStyle = '#00e5ff';
    ctx.lineWidth   = 2;
    ctx.fill();
    ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 12;
    ctx.stroke(); ctx.shadowBlur = 0;
  }

  // Overlay "aguardando primeiro toque"
  if (waitingForFirstTouch) {
    ctx.fillStyle = 'rgba(5,5,15,0.55)';
    ctx.fillRect(0, 0, W, H);

    // Ponto fantasma no centro indicando onde o jogador vai aparecer
    ctx.beginPath(); ctx.arc(W/2, H/2, player.r, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(0,229,255,0.25)'; ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);

    ctx.font      = `${Math.round(W * 0.038)}px 'Share Tech Mono', monospace`;
    ctx.fillStyle = 'rgba(0,229,255,0.7)';
    ctx.textAlign = 'center';
    ctx.fillText('TOQUE PARA COMEÇAR', W/2, H/2 - player.r - 22);
    ctx.fillStyle = 'rgba(42,58,90,0.9)';
    ctx.font      = `${Math.round(W * 0.028)}px 'Share Tech Mono', monospace`;
    ctx.fillText('O timer inicia no primeiro toque', W/2, H/2 + player.r + 22);
  }

  // Flash de colisão
  if (!player.alive) {
    ctx.fillStyle = 'rgba(255,0,85,0.28)';
    ctx.fillRect(0, 0, W, H);
  }
}

// ── TIMER ───────────────────────────────────────────────────────────────────
function tickTimer() {
  if (!active || waitingForFirstTouch) return;
  timeLeft = cfg.time - (Date.now() - t0) / 1000;
  if (timeLeft <= 0) { timeLeft = 0; updateTimerHUD(); endGame(true); return; }
  updateTimerHUD();
}

function updateTimerHUD() {
  const secs = Math.ceil(Math.max(0, timeLeft));
  const el   = document.getElementById('htimer');
  el.textContent = secs;
  const ratio    = timeLeft / cfg.time;
  el.className   = 'hud-timer' +
    (ratio <= .2 ? ' t-danger' : ratio <= .4 ? ' t-warn' : '');
}

// ── FIM ─────────────────────────────────────────────────────────────────────
function endGame(win) {
  if (!active) return;
  active = false;
  clearInterval(ticker);
  cancelAnimationFrame(raf);
  clearListeners();

  if (!win) player.alive = false;
  survived = cfg.time - Math.max(0, timeLeft);

  setTimeout(() => showResult(win), win ? 400 : 900);
}

function showResult(win) {
  show('result');
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  document.getElementById('rtag').textContent   = win ? 'missão cumprida'   : 'impacto detectado';
  document.getElementById('rtitle').textContent = win ? 'SOBREVIVEU'        : 'ELIMINADO';
  document.getElementById('rtitle').className   = 'res-title ' + (win ? 'ok' : 'bad');
  document.getElementById('rmsg').textContent   = pick(win ? MSGS_OK : MSGS_FAIL);
  document.getElementById('rstats').innerHTML   = `
DIFICULDADE: <b>${cfg.label}</b><br>
TEMPO SOBREVIVIDO: <b>${survived.toFixed(1)}s / ${cfg.time}s</b><br>
PROJÉTEIS: <b>${cfg.n}</b>
  `.trim();
}

function retry() { countdown(); }
function goSel() { show('sel'); }

// ── HELPERS ─────────────────────────────────────────────────────────────────
function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function clearListeners() {
  const c = document.getElementById('arena');
  if (!c) return;
  c.removeEventListener('touchstart', onTouch);
  c.removeEventListener('touchmove',  onTouch);
  c.removeEventListener('mousedown',  onMouse);
  c.removeEventListener('mousemove',  onMouse);
}
</script>

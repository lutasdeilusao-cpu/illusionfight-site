<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MG-01 · Sliding Puzzle</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap');

:root {
  --bg:     #05050f;
  --cyan:   #00e5ff;
  --purple: #b400ff;
  --red:    #ff0055;
  --gold:   #ffcc00;
  --ghost:  #2a3a5a;
  --dim:    #0d1a2e;
  --mono:   'Share Tech Mono', monospace;
  --head:   'Bebas Neue', sans-serif;
}

* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

html, body {
  width:100%; height:100%; overflow:hidden;
  background:var(--bg);
  font-family:var(--mono);
  user-select:none; -webkit-user-select:none;
}

body::after {
  content:''; position:fixed; inset:0; z-index:9999; pointer-events:none;
  background:repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0,0,0,0.18) 2px, rgba(0,0,0,0.18) 4px
  );
}

.grid-bg {
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
  background-size:28px 28px;
}

.screen {
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:28px 20px;
}
.screen.off { display:none; }

/* ── SELECT ── */
.sel-tag   { font-size:.62rem; letter-spacing:.35em; color:var(--ghost); text-transform:uppercase; margin-bottom:10px; }
.sel-title { font-family:var(--head); font-size:3.4rem; letter-spacing:.12em; color:var(--cyan); text-align:center; line-height:1; text-shadow:0 0 24px var(--cyan); margin-bottom:6px; }
.sel-sub   { font-size:.62rem; letter-spacing:.18em; color:var(--ghost); text-transform:uppercase; text-align:center; margin-bottom:40px; }

.btns { display:flex; flex-direction:column; gap:8px; width:100%; max-width:340px; }
.diff-btn {
  background:transparent; border:1px solid var(--ghost); font-family:var(--mono);
  text-transform:uppercase; display:flex; flex-direction:column;
  justify-content:center; gap:3px; padding:0 18px; min-height:58px;
  cursor:pointer; transition:.15s; text-align:left;
}
.diff-btn .dn { font-size:.85rem; letter-spacing:.12em; }
.diff-btn .di { font-size:.58rem; letter-spacing:.08em; color:var(--ghost); }
.dif-easy   .dn { color:var(--cyan); }
.dif-normal .dn { color:var(--purple); }
.dif-hard   .dn { color:var(--red); }
.diff-btn:active { opacity:.7; }
@media(hover:hover){
  .dif-easy:hover   { border-color:var(--cyan);   background:rgba(0,229,255,.04); }
  .dif-normal:hover { border-color:var(--purple); background:rgba(180,0,255,.04); }
  .dif-hard:hover   { border-color:var(--red);    background:rgba(255,0,85,.04); }
}

/* ── COUNTDOWN ── */
#cdown { background:var(--bg); }
.cdown-n {
  font-family:var(--head); font-size:9rem; line-height:1;
  color:var(--cyan); text-shadow:0 0 30px var(--cyan);
  animation:popIn .6s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes popIn { from{transform:scale(2);opacity:0} to{transform:scale(1);opacity:1} }

/* ── GAME ── */
#game { padding:0; justify-content:flex-start; gap:0; }

.hud {
  width:100%; display:flex; align-items:center; justify-content:space-between;
  padding:8px 16px; border-bottom:1px solid var(--ghost);
  background:rgba(5,5,15,.95); flex-shrink:0;
}
.hud-timer {
  font-family:var(--head); font-size:2.2rem; letter-spacing:.06em;
  color:var(--cyan); min-width:80px;
}
.hud-timer.t-warn   { color:var(--gold); text-shadow:0 0 10px var(--gold); }
.hud-timer.t-danger { color:var(--red);  text-shadow:0 0 10px var(--red); animation:blink .45s infinite; }
@keyframes blink { 50%{opacity:.4} }

.hud-center { text-align:center; }
.hud-moves  { font-family:var(--head); font-size:1.5rem; color:var(--cyan); display:block; line-height:1; }
.hud-lbl    { font-size:.55rem; letter-spacing:.2em; color:var(--ghost); text-transform:uppercase; }
.hud-diff   { font-size:.6rem; letter-spacing:.12em; text-transform:uppercase; text-align:right; min-width:80px; }

/* Arena */
.arena {
  flex:1; width:100%;
  display:flex; align-items:center; justify-content:center;
  padding:16px;
  background:var(--bg);
  background-image:
    linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
  background-size:28px 28px;
}

/* Grid do puzzle */
.puzzle-grid {
  display:grid;
  gap:4px;
}

/* Peça */
.tile {
  display:flex; align-items:center; justify-content:center;
  font-family:var(--head); letter-spacing:.04em;
  border:1px solid var(--ghost);
  background:var(--dim);
  color:var(--cyan);
  cursor:pointer;
  transition: transform .12s ease, background .12s, border-color .12s, box-shadow .12s;
  position:relative; overflow:hidden;
}
.tile::before {
  content:'';
  position:absolute; inset:0;
  background:linear-gradient(135deg, rgba(0,229,255,0.06) 0%, transparent 60%);
  pointer-events:none;
}
.tile:active { transform:scale(.93); }
.tile.movable {
  border-color:rgba(0,229,255,0.5);
  background:#0a1f35;
  box-shadow:0 0 8px rgba(0,229,255,0.15);
}
.tile.movable:active { transform:scale(.9); background:#0d2640; }
.tile.empty {
  background:transparent; border-color:var(--ghost);
  cursor:default; box-shadow:none;
  opacity:.25;
}
.tile.correct {
  border-color:rgba(0,229,255,0.25);
  background:#071420;
  color:rgba(0,229,255,0.4);
}
.tile.flash {
  animation:flashAnim .22s ease-out;
}
@keyframes flashAnim {
  0%   { background:#0d2640; box-shadow:0 0 18px rgba(0,229,255,0.5); }
  100% { background:var(--dim); box-shadow:none; }
}

/* ── RESULT ── */
#result { gap:14px; }
.res-tag   { font-size:.62rem; letter-spacing:.35em; color:var(--ghost); text-transform:uppercase; }
.res-title { font-family:var(--head); font-size:3.2rem; letter-spacing:.12em; line-height:1; text-align:center; }
.res-title.ok  { color:var(--cyan); text-shadow:0 0 20px var(--cyan); }
.res-title.bad { color:var(--red);  text-shadow:0 0 20px var(--red); }
.res-msg   { font-size:.68rem; letter-spacing:.08em; color:var(--ghost); text-align:center; line-height:1.9; max-width:300px; }
.res-stats { border:1px solid var(--ghost); padding:12px 20px; font-size:.65rem; letter-spacing:.1em; color:var(--ghost); line-height:2.1; text-align:center; min-width:260px; background:rgba(0,229,255,.03); }
.res-stats b { color:var(--cyan); font-weight:normal; }
.res-btns  { display:flex; flex-direction:column; gap:8px; width:100%; max-width:300px; margin-top:6px; }
.res-btn   { background:transparent; font-family:var(--mono); font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; border:1px solid; min-height:48px; cursor:pointer; transition:.15s; }
.res-btn.p { border-color:var(--cyan);  color:var(--cyan); }
.res-btn.s { border-color:var(--ghost); color:var(--ghost); }
.res-btn.p:active { background:var(--cyan);  color:var(--bg); }
.res-btn.s:active { border-color:var(--cyan); color:var(--cyan); }
@media(hover:hover){
  .res-btn.p:hover { background:var(--cyan);  color:var(--bg); }
  .res-btn.s:hover { border-color:var(--cyan); color:var(--cyan); }
}
</style>
</head>
<body>

<!-- SELECT -->
<div id="sel" class="screen grid-bg">
  <div class="sel-tag">Minigame · MG-01</div>
  <div class="sel-title">SLIDING<br>PUZZLE</div>
  <div class="sel-sub">Reorganize o fluxo de dados fragmentado</div>
  <div class="btns">
    <button class="diff-btn dif-easy"   onclick="pick('easy')">
      <span class="dn">◎ Fácil</span>
      <span class="di">Grade 3×3 · 8 peças · 3 minutos</span>
    </button>
    <button class="diff-btn dif-normal" onclick="pick('normal')">
      <span class="dn">◎ Normal</span>
      <span class="di">Grade 4×4 · 15 peças · 10 minutos</span>
    </button>
    <button class="diff-btn dif-hard"   onclick="pick('hard')">
      <span class="dn">◎ Difícil</span>
      <span class="di">Grade 5×5 · 24 peças · 20 minutos</span>
    </button>
  </div>
</div>

<!-- COUNTDOWN -->
<div id="cdown" class="screen off">
  <div class="cdown-n" id="cdown-n">3</div>
</div>

<!-- GAME -->
<div id="game" class="screen off">
  <div class="hud">
    <div class="hud-timer" id="htimer">3:00</div>
    <div class="hud-center">
      <span class="hud-moves" id="hmoves">0</span>
      <span class="hud-lbl">movimentos</span>
    </div>
    <div class="hud-diff" id="hdiff"></div>
  </div>
  <div class="arena">
    <div class="puzzle-grid" id="pgrid"></div>
  </div>
</div>

<!-- RESULT -->
<div id="result" class="screen off grid-bg">
  <div class="res-tag"   id="rtag"></div>
  <div class="res-title" id="rtitle"></div>
  <div class="res-msg"   id="rmsg"></div>
  <div class="res-stats" id="rstats"></div>
  <div class="res-btns">
    <button class="res-btn p" onclick="retry()">◎ Tentar Novamente</button>
    <button class="res-btn s" onclick="goSel()">← Selecionar Dificuldade</button>
  </div>
</div>

<script>
// ── CONFIG ───────────────────────────────────────────────────────────────────
const CFG = {
  easy:   { size:3, time:180,  label:'FÁCIL',   col:'#00e5ff' },
  normal: { size:4, time:600,  label:'NORMAL',  col:'#b400ff' },
  hard:   { size:5, time:1200, label:'DIFÍCIL', col:'#ff0055' },
};

const MSGS_OK = [
  'Sequência restaurada.\nFluxo de dados estabilizado.',
  'Fragmentação corrigida.\nSistema operacional.',
  'Protocolo de desfragmentação concluído.\nAcesso liberado.',
  'Excelente, operador.\nA matriz está íntegra.',
];
const MSGS_FAIL = [
  'Tempo esgotado.\nFragmentação permanente detectada.',
  'O sistema entrou em colapso.\nTente novamente.',
  'Desfragmentação incompleta.\nAcesso negado.',
  'A sequência permanece corrompida.\nReinicie o protocolo.',
];

// ── ESTADO ───────────────────────────────────────────────────────────────────
let diff, cfg;
let ticker = null;
let t0, timeLeft;
let active = false;
let moves = 0;
let board = [];       // array flat de valores (0 = vazio)
let emptyIdx = 0;
let size = 3;

// ── TELAS ────────────────────────────────────────────────────────────────────
function show(id) {
  ['sel','cdown','game','result'].forEach(s =>
    document.getElementById(s).classList.toggle('off', s !== id)
  );
}

// ── FLUXO ────────────────────────────────────────────────────────────────────
function pick(d) {
  diff = d; cfg = CFG[d];
  countdown();
}

function countdown() {
  show('cdown');
  const el = document.getElementById('cdown-n');
  let n = 3;
  const step = () => {
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
    el.textContent      = n === 0 ? 'GO!' : n;
    el.style.color      = n === 0 ? cfg.col : '#00e5ff';
    el.style.textShadow = `0 0 30px ${n === 0 ? cfg.col : '#00e5ff'}`;
    if (n === 0) { setTimeout(startGame, 550); return; }
    n--;
    setTimeout(step, 850);
  };
  step();
}

function startGame() {
  show('game');
  size  = cfg.size;
  moves = 0;
  active = true;

  document.getElementById('hdiff').textContent = cfg.label;
  document.getElementById('hdiff').style.color  = cfg.col;
  document.getElementById('hmoves').textContent = '0';

  // Gera e embaralha o tabuleiro (garantindo solução)
  board = generateBoard(size);
  emptyIdx = board.indexOf(0);

  buildGrid();
  renderBoard();

  // Timer
  t0       = Date.now();
  timeLeft = cfg.time;
  updateTimerHUD();
  ticker = setInterval(tickTimer, 500);
}

// ── GERAÇÃO DO TABULEIRO ─────────────────────────────────────────────────────
function generateBoard(n) {
  const total = n * n;
  // Começa resolvido e embaralha com movimentos aleatórios (garante solução)
  let b = Array.from({length: total}, (_, i) => (i + 1) % total);
  // 0 fica na última posição no início
  let empty = total - 1;

  const shuffleMoves = total * 60;
  for (let i = 0; i < shuffleMoves; i++) {
    const neighbors = getNeighbors(empty, n);
    const pick = neighbors[Math.floor(Math.random() * neighbors.length)];
    [b[empty], b[pick]] = [b[pick], b[empty]];
    empty = pick;
  }
  return b;
}

function getNeighbors(idx, n) {
  const r = Math.floor(idx / n);
  const c = idx % n;
  const nb = [];
  if (r > 0)     nb.push(idx - n);
  if (r < n - 1) nb.push(idx + n);
  if (c > 0)     nb.push(idx - 1);
  if (c < n - 1) nb.push(idx + 1);
  return nb;
}

function isSolved() {
  const total = size * size;
  for (let i = 0; i < total - 1; i++) {
    if (board[i] !== i + 1) return false;
  }
  return board[total - 1] === 0;
}

// ── GRID DOM ─────────────────────────────────────────────────────────────────
function buildGrid() {
  const grid  = document.getElementById('pgrid');
  const arena = document.querySelector('.arena');

  // Calcula tamanho de cada peça baseado na tela disponível
  const aW = arena.clientWidth  - 32;
  const aH = arena.clientHeight - 32;
  const maxSide = Math.min(aW, aH);
  const tileSize = Math.floor((maxSide - (size - 1) * 4) / size);
  const fontSize = Math.max(14, Math.floor(tileSize * 0.38));

  grid.style.gridTemplateColumns = `repeat(${size}, ${tileSize}px)`;
  grid.style.gridTemplateRows    = `repeat(${size}, ${tileSize}px)`;
  grid.innerHTML = '';

  for (let i = 0; i < size * size; i++) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.style.width    = tileSize + 'px';
    tile.style.height   = tileSize + 'px';
    tile.style.fontSize = fontSize + 'px';
    tile.dataset.idx = i;
    tile.addEventListener('click', () => onTileClick(i));
    tile.addEventListener('touchend', (e) => { e.preventDefault(); onTileClick(i); }, { passive:false });
    grid.appendChild(tile);
  }
}

function renderBoard() {
  const tiles = document.querySelectorAll('.tile');
  emptyIdx = board.indexOf(0);

  tiles.forEach((tile, i) => {
    const val = board[i];
    if (val === 0) {
      tile.textContent = '';
      tile.className   = 'tile empty';
      return;
    }

    tile.textContent = val;
    const isCorrect  = val === i + 1;
    const isMovable  = getNeighbors(emptyIdx, size).includes(i);

    tile.className = 'tile' +
      (isMovable ? ' movable' : '') +
      (isCorrect && !isMovable ? ' correct' : '');
  });
}

// ── INTERAÇÕES ───────────────────────────────────────────────────────────────
function onTileClick(idx) {
  if (!active) return;
  if (board[idx] === 0) return;

  const neighbors = getNeighbors(emptyIdx, size);
  if (!neighbors.includes(idx)) return;

  // Swap
  [board[idx], board[emptyIdx]] = [board[emptyIdx], board[idx]];
  emptyIdx = idx;
  moves++;

  document.getElementById('hmoves').textContent = moves;

  // Flash na peça movida (agora na posição emptyIdx anterior)
  const tiles = document.querySelectorAll('.tile');
  tiles[emptyIdx].classList.add('flash');
  setTimeout(() => tiles[emptyIdx]?.classList.remove('flash'), 230);

  renderBoard();

  if (isSolved()) endGame(true);
}

// ── TIMER ────────────────────────────────────────────────────────────────────
function tickTimer() {
  if (!active) return;
  timeLeft = cfg.time - (Date.now() - t0) / 1000;
  if (timeLeft <= 0) { timeLeft = 0; updateTimerHUD(); endGame(false); return; }
  updateTimerHUD();
}

function updateTimerHUD() {
  const total = Math.ceil(Math.max(0, timeLeft));
  const m     = Math.floor(total / 60);
  const s     = total % 60;
  const el    = document.getElementById('htimer');
  el.textContent = `${m}:${String(s).padStart(2,'0')}`;
  const ratio    = timeLeft / cfg.time;
  el.className   = 'hud-timer' +
    (ratio <= .1 ? ' t-danger' : ratio <= .25 ? ' t-warn' : '');
}

// ── FIM ──────────────────────────────────────────────────────────────────────
function endGame(win) {
  if (!active) return;
  active = false;
  clearInterval(ticker);

  const elapsed = cfg.time - Math.max(0, timeLeft);
  setTimeout(() => showResult(win, elapsed), win ? 600 : 800);
}

function showResult(win, elapsed) {
  show('result');
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const m = Math.floor(elapsed / 60), s = Math.floor(elapsed % 60);

  document.getElementById('rtag').textContent   = win ? 'sequência restaurada' : 'falha crítica';
  document.getElementById('rtitle').textContent = win ? 'SISTEMA\nRESTAURADO'  : 'SISTEMA\nCORROMPIDO';
  document.getElementById('rtitle').className   = 'res-title ' + (win ? 'ok' : 'bad');
  document.getElementById('rmsg').textContent   = pick(win ? MSGS_OK : MSGS_FAIL);
  document.getElementById('rstats').innerHTML   = `
DIFICULDADE: <b>${cfg.label}</b><br>
MOVIMENTOS: <b>${moves}</b><br>
TEMPO: <b>${m}:${String(s).padStart(2,'0')} / ${Math.floor(cfg.time/60)}:00</b>
  `.trim();
}

function retry() { countdown(); }
function goSel() { show('sel'); }
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Illusion Fight</title>
  <!-- Prévia de link (WhatsApp/Twitter) pra qualquer endereço que não tem
       página estática própria — nunca sai link sem miniatura. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Illusion Fight">
  <meta property="og:title" content="Illusion Fight — Virtual Arena. The pain is 100% real.">
  <meta property="og:description" content="A sci-fi universe with WEB SHARD comics, stories, tactical games and an original soundtrack.">
  <meta property="og:image" content="https://illusionfight.com/og-image-webshard.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://illusionfight.com/og-image-webshard.jpg">
  <!-- Meta refresh fallback para crawlers (Googlebot) que não executam JS -->
  <meta http-equiv="refresh" content="0;url=https://illusionfight.com/">
  <script>
    // Salva a URL original para o index.html restaurar
    sessionStorage.redirect = location.href;

    // SPA redirect — domínio customizado (root), pathSegmentsToKeep = 0
    var l = window.location;
    var path = l.pathname.slice(1);
    l.replace(
      l.protocol + '//' + l.host + '/?/' +
      path + (l.search ? '&' + l.search.slice(1) : '') +
      l.hash
    );
  </script>
</head>
</html>
